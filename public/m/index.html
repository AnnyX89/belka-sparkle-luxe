<!-- QR-код с магнита: считаем переход в Метрике и сразу ведём в группу ВК.
     Чтобы вести QR в другое место — поменять TARGET (магниты перепечатывать не нужно). -->
<script>
  var TARGET = "https://vk.com/belkaclean74";
  var go = function () { location.replace(TARGET); };
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
   (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
  ym(113260710, "init", { defer: true });
  ym(113260710, "hit", "/m?src=magnet", { title: "QR с магнита", referer: document.referrer });
  ym(113260710, "reachGoal", "qr_magnet", {}, go);
  setTimeout(go, 1200); // если Метрика не ответила — всё равно уходим
</script>
